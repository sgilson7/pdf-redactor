[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": that compiles panics down to a bare
# `unreachable`, so a failure surfaces in the browser as
# "Unreachable code should not be executed" with no indication of what broke.
